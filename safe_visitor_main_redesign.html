
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); }
  .screen {
    background: #F4F6F9;
    border-radius: var(--border-radius-lg);
    padding: 2rem 2rem 1.5rem;
    min-height: 480px;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    border: 0.5px solid var(--color-border-tertiary);
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo-area {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-badge {
    background: #1B4FD8;
    color: #fff;
    font-size: 18px;
    font-weight: 500;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: -1px;
  }
  .logo-text {
    font-size: 20px;
    font-weight: 500;
    color: var(--color-text-primary);
    letter-spacing: -0.3px;
  }
  .logo-sub {
    font-size: 12px;
    color: var(--color-text-secondary);
    margin-top: 1px;
  }
  .time-area {
    text-align: right;
  }
  .time-big {
    font-size: 22px;
    font-weight: 500;
    color: var(--color-text-primary);
    font-variant-numeric: tabular-nums;
  }
  .time-date {
    font-size: 12px;
    color: var(--color-text-secondary);
  }

  .hero-action {
    background: #1B4FD8;
    color: #fff;
    border-radius: 14px;
    padding: 1.2rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 16px;
    cursor: pointer;
    transition: background 0.15s;
    border: none;
    width: 100%;
    text-align: left;
  }
  .hero-action:hover { background: #1741B6; }
  .hero-icon {
    background: rgba(255,255,255,0.15);
    border-radius: 10px;
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .hero-icon i { font-size: 22px; color: #fff; }
  .hero-text {}
  .hero-label {
    font-size: 17px;
    font-weight: 500;
    color: #fff;
  }
  .hero-desc {
    font-size: 12px;
    color: rgba(255,255,255,0.7);
    margin-top: 2px;
  }
  .hero-arrow {
    margin-left: auto;
    font-size: 22px;
    color: rgba(255,255,255,0.6);
  }

  .secondary-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .sec-btn {
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: 12px;
    padding: 1rem 1.1rem;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: background 0.12s;
    text-align: left;
  }
  .sec-btn:hover { background: var(--color-background-secondary); }
  .sec-icon {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .sec-icon i { font-size: 18px; }
  .sec-icon.checkout { background: #EBF5FF; color: #1B4FD8; }
  .sec-icon.checkout i { color: #1B4FD8; }
  .sec-icon.keys { background: #FFF7E6; color: #B45309; }
  .sec-icon.keys i { color: #B45309; }
  .sec-icon.nobadge { background: #F3F4F6; color: #374151; }
  .sec-icon.nobadge i { color: #374151; }
  .sec-icon.intern { background: #EBF5FF; color: #1B4FD8; }
  .sec-icon.intern i { color: #1B4FD8; }
  .sec-label {
    font-size: 14px;
    font-weight: 500;
    color: var(--color-text-primary);
  }
  .sec-desc {
    font-size: 11px;
    color: var(--color-text-secondary);
    margin-top: 1px;
  }

  .category-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--color-text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }

  .staff-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .staff-btn {
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: 10px;
    padding: 0.75rem 0.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: background 0.12s;
  }
  .staff-btn:hover { background: var(--color-background-secondary); }
  .staff-dot {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .staff-dot i { font-size: 14px; }
  .dot-medical { background: #FEE2E2; }
  .dot-medical i { color: #B91C1C; }
  .dot-limpieza { background: #EBF5FF; }
  .dot-limpieza i { color: #1B4FD8; }
  .dot-seguridad { background: #F3F4F6; }
  .dot-seguridad i { color: #374151; }
  .staff-name {
    font-size: 11px;
    color: var(--color-text-secondary);
    text-align: center;
    line-height: 1.3;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 0.5rem;
    border-top: 0.5px solid var(--color-border-tertiary);
  }
  .footer-brand {
    font-size: 11px;
    color: var(--color-text-secondary);
  }
  .footer-version {
    font-size: 11px;
    color: var(--color-text-tertiary);
  }
  .status-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #22C55E;
    margin-right: 4px;
    vertical-align: middle;
  }
</style>

<div class="screen">
  <div class="header">
    <div class="logo-area">
      <div class="logo-badge">S</div>
      <div>
        <div class="logo-text">Safe</div>
        <div class="logo-sub">Control de acceso</div>
      </div>
    </div>
    <div class="time-area">
      <div class="time-big" id="clock">--:--</div>
      <div class="time-date" id="datestr">--</div>
    </div>
  </div>

  <button class="hero-action" onclick="sendPrompt('¿Cómo debería verse el flujo de registro de nuevo visitante?')">
    <div class="hero-icon">
      <i class="ti ti-user-plus" aria-hidden="true"></i>
    </div>
    <div class="hero-text">
      <div class="hero-label">Registrar nuevo visitante</div>
      <div class="hero-desc">Captura datos, toma foto y genera gafete</div>
    </div>
    <i class="ti ti-arrow-right hero-arrow" aria-hidden="true"></i>
  </button>

  <div>
    <div class="category-label">Acciones rápidas</div>
    <div class="secondary-row">
      <button class="sec-btn">
        <div class="sec-icon checkout"><i class="ti ti-door-exit" aria-hidden="true"></i></div>
        <div>
          <div class="sec-label">Registrar salida</div>
          <div class="sec-desc">Check out</div>
        </div>
      </button>
      <button class="sec-btn">
        <div class="sec-icon keys"><i class="ti ti-key" aria-hidden="true"></i></div>
        <div>
          <div class="sec-label">Llaves</div>
          <div class="sec-desc">Préstamo y devolución</div>
        </div>
      </button>
      <button class="sec-btn">
        <div class="sec-icon nobadge"><i class="ti ti-id-badge-off" aria-hidden="true"></i></div>
        <div>
          <div class="sec-label">Sin gafete</div>
          <div class="sec-desc">Acceso sin identificación</div>
        </div>
      </button>
      <button class="sec-btn">
        <div class="sec-icon intern"><i class="ti ti-school" aria-hidden="true"></i></div>
        <div>
          <div class="sec-label">Practicantes</div>
          <div class="sec-desc">Registro de trainees</div>
        </div>
      </button>
    </div>
  </div>

  <div>
    <div class="category-label">Personal interno</div>
    <div class="staff-row">
      <button class="staff-btn">
        <div class="staff-dot dot-medical"><i class="ti ti-stethoscope" aria-hidden="true"></i></div>
        <div class="staff-name">Personal médico</div>
      </button>
      <button class="staff-btn">
        <div class="staff-dot dot-limpieza"><i class="ti ti-mop" aria-hidden="true"></i></div>
        <div class="staff-name">Limpieza</div>
      </button>
      <button class="staff-btn">
        <div class="staff-dot dot-seguridad"><i class="ti ti-shield" aria-hidden="true"></i></div>
        <div class="staff-name">Seguridad</div>
      </button>
    </div>
  </div>

  <div class="footer">
    <div class="footer-brand">
      <span class="status-dot"></span>
      EA Solutions · L'esprit industriel
    </div>
    <div class="footer-version">v 3.0.0</div>
  </div>
</div>

<script>
function tick() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent = h + ':' + m;
  const days = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const d = now.getDay(), dd = now.getDate(), mo = now.getMonth(), yr = now.getFullYear();
  document.getElementById('datestr').textContent = days[d] + ' ' + dd + ' ' + months[mo] + ' ' + yr;
}
tick();
setInterval(tick, 10000);
</script>
